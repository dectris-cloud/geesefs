name: PR Tests

on:
  pull_request:
    branches:
      - master
      - main
  pull_request_target:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        # For pull_request_target, we need to checkout the PR head
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4  # v4
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c  # v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Get dependencies
      run: go mod download

    - name: Build linux amd64
      run: env CGO_ENABLED=0 go build -o geesefs-linux-amd64 -v && ln -s geesefs-linux-amd64 geesefs

    - name: Run go vet (allow warnings for now)
      run: go vet ./... || echo "go vet has warnings - should be fixed in future PR"
      continue-on-error: true

    - name: Run tests
      run: SAME_PROCESS_MOUNT=1 make run-test
      timeout-minutes: 12

    - name: Run xfstests
      # Often crashes in CI due to memory limits
      continue-on-error: true
      run: make run-xfstests
      timeout-minutes: 10

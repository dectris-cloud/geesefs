# GeeseFS multipart-copy boundary reproducer
#
# Reproduces the Feb 2026 bug pattern: UploadPartCopy issues a range past
# the source object size during fsync, leading to:
#   "Failed to copy unmodified range ..."
#   "InvalidArgument: Range specified is not valid for source object of size"
#   "fuseops.SyncFileOp error: invalid argument"
#
# Shrinks --part-sizes so the unaligned-final-part code path is exercised in
# seconds rather than the original ~21 GB / ~30 min workload.

services:
  # S3 server (RustFS). The service is named `minio` because the endpoint
  # http://minio:9000 and the test scripts refer to it by that name.
  minio:
    image: rustfs/rustfs:1.0.4
    container_name: multipart-copy-minio
    ports:
      - "9300:9000"
      - "9301:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  minio-init:
    image: amazon/aws-cli:2.38.5
    container_name: multipart-copy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3api head-bucket --bucket testbucket 2>/dev/null || aws s3api create-bucket --bucket testbucket
        echo 'Bucket testbucket ready'
    networks:
      - test-network

  geesefs:
    build:
      context: ../../..
      dockerfile: docker/tests/multipart_copy_boundary/Dockerfile.geesefs
    container_name: multipart-copy-geesefs
    depends_on:
      minio-init:
        condition: service_completed_successfully
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    # Tight RAM so geesefs has to flush parts mid-stream instead of buffering
    # the whole file. Forces the multi-flush state the original bug needs.
    # 256m container budget leaves headroom for FUSE bridge + flusher buffers
    # (16 flushers x 5 MB part = 80 MB worst case); --memory-limit 32 keeps
    # geesefs internal data cache small enough that buffers must drain to S3
    # mid-write.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: testbucket
      MOUNT_POINT: /mnt/s3
      # 20 x 5 MB parts, then 10 x 25 MB parts. Small enough for a fast test,
      # same multipart-copy code path as default sizing.
      GEESEFS_OPTS: "--debug_s3 --debug_fuse --part-sizes 5:20,25:10 --memory-limit 32 --max-flushers 4 --max-parallel-parts 8 --stat-cache-ttl 1s"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "mountpoint", "-q", "/mnt/s3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test:
    image: docker:cli
    container_name: multipart-copy-test
    depends_on:
      geesefs:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./test_multipart_copy_boundary.sh:/test.sh:ro
    working_dir: /
    command: ["sh", "/test.sh"]
    networks:
      - test-network

volumes:
  minio-data:

networks:
  test-network:
    driver: bridge

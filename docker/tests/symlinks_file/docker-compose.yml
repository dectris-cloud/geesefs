# GeeseFS Symlinks File Test - Tests .geesefs_symlinks file cross-mount visibility
# Usage: docker compose up --build

services:
  # S3 server (RustFS). The service is named `minio` because the endpoint
  # http://minio:9000 and the test scripts refer to it by that name.
  minio:
    image: rustfs/rustfs:1.0.4
    container_name: symlinks-test-minio
    ports:
      - "9300:9000"
      - "9301:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # Create the test bucket on startup
  minio-init:
    image: amazon/aws-cli:2.38.5
    container_name: symlinks-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment: &s3-client-env
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3api head-bucket --bucket testbucket 2>/dev/null || aws s3api create-bucket --bucket testbucket
        echo 'Bucket testbucket ready'
    networks:
      - test-network

  # Long-running S3 client: the test script and justfile helpers read raw
  # objects through it with `docker exec`.
  s3-client:
    image: amazon/aws-cli:2.38.5
    container_name: symlinks-test-s3-client
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment: *s3-client-env
    entrypoint: ["sleep", "infinity"]
    init: true
    networks:
      - test-network

  # GeeseFS container 1
  geesefs-1:
    build:
      context: ../../..
      dockerfile: docker/tests/symlinks_file/Dockerfile.geesefs
    container_name: symlinks-test-mount-1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: testbucket
      MOUNT_POINT: /mnt/s3
      GEESEFS_OPTS: "--debug_s3 --debug_fuse --enable-symlinks-file --stat-cache-ttl 3s"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "mountpoint", "-q", "/mnt/s3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GeeseFS container 2
  geesefs-2:
    build:
      context: ../../..
      dockerfile: docker/tests/symlinks_file/Dockerfile.geesefs
    container_name: symlinks-test-mount-2
    depends_on:
      minio-init:
        condition: service_completed_successfully
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: testbucket
      MOUNT_POINT: /mnt/s3
      GEESEFS_OPTS: "--debug_s3 --debug_fuse --enable-symlinks-file --stat-cache-ttl 3s"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "mountpoint", "-q", "/mnt/s3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Test runner container
  test:
    image: docker:cli
    container_name: symlinks-test-runner
    depends_on:
      geesefs-1:
        condition: service_healthy
      geesefs-2:
        condition: service_healthy
      s3-client:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./test_symlinks_file.sh:/test.sh:ro
    working_dir: /
    command: ["sh", "/test.sh"]
    networks:
      - test-network

volumes:
  minio-data:

networks:
  test-network:
    driver: bridge

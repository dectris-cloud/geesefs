# Conditional Writes Test - Tests S3 If-Match/If-None-Match via direct S3 API
# Usage: docker compose up --build

services:
  # S3 server (RustFS). The service is named `minio` because the endpoint
  # http://minio:9000 and the test scripts refer to it by that name.
  minio:
    image: rustfs/rustfs:1.0.4
    container_name: conditional-writes-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # Create the test bucket on startup
  minio-init:
    image: amazon/aws-cli:2.38.5
    container_name: conditional-writes-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3api head-bucket --bucket testbucket 2>/dev/null || aws s3api create-bucket --bucket testbucket
        echo 'Bucket testbucket ready'
    networks:
      - test-network

  # Test container for conditional write tests using S3 API directly
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conditional-writes-test
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: testbucket
    networks:
      - test-network
    command: ["python3", "/app/test_conditional_writes.py"]

volumes:
  minio-data:

networks:
  test-network:
    driver: bridge
